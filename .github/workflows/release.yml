# Push a tag like v1.0.0 -> builds bakgarden.mrpack and attaches it to a GitHub Release.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/bakgarden.mrpack
